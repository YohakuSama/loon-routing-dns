name: Composite Rule Library — tests and review updates

on:
  pull_request:
    paths:
      - 'rules/**'
      - 'scripts/build_composite_rules.py'
      - 'tests/test_composite_rules.py'
      - '.github/workflows/composite-rules.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1,4'

permissions:
  contents: read

concurrency:
  group: composite-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-parser:
    name: Offline rule builder regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_composite_rules.py' -v
      - name: Validate catalog JSON
        run: python3 -m json.tool rules/sources.json >/dev/null

  preview-staging:
    name: Fetch sources and publish review-only staging artifact
    if: github.event_name == 'pull_request'
    needs: validate-parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate rules (does not change active config)
        run: python3 scripts/build_composite_rules.py
      - uses: actions/upload-artifact@v4
        with:
          name: loon-hybrid-config-and-rules
          path: |
            reviews/Loon_Routing_DNS_Hybrid_Review.lcf
            rules/generated/
            rules/sources.json
            rules/HYBRID_DESIGN.md
            rules/LICENSE.*
          if-no-files-found: error
          retention-days: 14

  publish-v5-release-candidate:
    name: Build and commit reviewed v5.1.0 rules to release PR branch
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/self-hosted-hybrid-rules-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: validate-parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/self-hosted-hybrid-rules-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all current domain sets
        run: python3 scripts/build_composite_rules.py
      - name: Check publication has 33 complete self-hosted lists
        run: |
          python3 tests/test_hybrid_profile.py --generated
          python3 scripts/validate_repo.py
      - name: Commit generated rules to release PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/generated
          if ! git diff --cached --quiet; then
            git commit -m "chore(rules): publish verified 87-source v5.1.0 snapshot"
            git push origin HEAD:refs/heads/feat/self-hosted-hybrid-rules-v1
          fi

  build-draft:
    name: Prepare staged upstream refresh for review
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    needs: validate-parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate library and conflict report
        run: python3 scripts/build_composite_rules.py
      - name: Refuse empty generated library
        run: |
          test -s rules/generated/audit.json
          test -s rules/generated/AI.list
          test -s rules/generated/AdBlock.list
          test -s rules/generated/ChinaDirect.list
      - name: Open a draft PR on rule changes (never merge automatically)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: rules/generated
          branch: automation/composite-rules-refresh
          delete-branch: true
          commit-message: 'chore(rules): stage upstream composite rules refresh'
          title: 'chore(rules): review new upstream composite rules'
          body: |
            Automated, unmerged **staging-only** rules.
            - Compare `rules/generated/audit.json` and changed .list files.
            - Review different-policy conflicts, domain ancestor conflicts, quarantined syntax and copyright.
            - Perform Loon iPhone tests before enabling any of these lists.
            - This PR DOES NOT modify the active Loon_Routing_DNS.lcf.
            - No automatic merge is configured.
          draft: true
