name: Composite Rule Library — tests and review updates

on:
  pull_request:
    paths:
      - 'rules/**'
      - 'scripts/build_composite_rules.py'
      - 'tests/test_composite_rules.py'
      - '.github/workflows/composite-rules.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1,4'

permissions:
  contents: read

concurrency:
  group: composite-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-parser:
    name: Offline rule builder regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_composite_rules.py' -v
      - name: Validate catalog JSON
        run: python3 -m json.tool rules/sources.json >/dev/null

  preview-staging:
    name: Fetch sources and publish review-only staging artifact
    if: github.event_name == 'pull_request'
    needs: validate-parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate rules (does not change active config)
        run: python3 scripts/build_composite_rules.py
      - uses: actions/upload-artifact@v4
        with:
          name: loonkit-rules-preview
          path: |
            rules/generated/
            rules/sources.json
            rules/HYBRID_DESIGN.md
            rules/LICENSE.*
          if-no-files-found: error
          retention-days: 14

  review-upstream:
    name: Stage upstream preview artifact without pushing or creating PR
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    needs: validate-parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated preview only (never commit, push or merge)
        run: python3 scripts/build_composite_rules.py
      - name: Refuse empty candidate rules
        run: |
          test -s rules/generated/audit.json
          test -s rules/generated/AI.list
          test -s rules/generated/AdBlock.list
          test -s rules/generated/ChinaDirect.list
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-upstream-review-only
          path: |
            rules/generated/
            rules/sources.json
            rules/LICENSE.*
          if-no-files-found: error
          retention-days: 14
