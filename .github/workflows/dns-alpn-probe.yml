name: Temporary bash.ws ALPN contract check

on:
  pull_request:
    paths: ['.github/workflows/dns-alpn-probe.yml']

permissions:
  contents: read

jobs:
  alpn:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check bash.ws live h1 vs h2 without printing session IDs
        shell: bash
        run: |
          set -eu
          curl --version | head -1
          id=$(curl -fsSL --max-time 10 https://bash.ws/id)
          if [[ ! "$id" =~ ^[a-zA-Z0-9]{8,63}$ ]]; then
            echo 'Unexpected ID response format'
            exit 1
          fi
          for protocol in --http1.1 --http2; do
            printf 'protocol=%s ' "$protocol"
            curl "$protocol" -sS -L --max-time 12 -o /dev/null -w 'negotiated_version=%{http_version} status=%{http_code} tls_verify=%{ssl_verify_result}\n' "https://bash.ws/dnsleak/test/$id?json"
          done
