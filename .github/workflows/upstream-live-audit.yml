name: Full Upstream Live Audit
on:
  pull_request:
    paths:
      - 'scripts/upstream_review.py'
      - 'scripts/verify_upstream_coverage.py'
      - 'tests/test_maintenance.py'
      - 'scripts/rule_engine.py'
      - 'rules/routing_guardrails.json'
      - '.github/workflows/rules-update.yml'
      - '.github/workflows/upstream-live-audit.yml'
      - 'rules/sources.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download all 87 sources and generate quarantined review
        run: python3 scripts/upstream_review.py --output "$RUNNER_TEMP/upstream-review"
      - name: Upload source snapshots and risk findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-upstream-live-review
          path: ${{ runner.temp }}/upstream-review/
          retention-days: 7
          if-no-files-found: warn
      - name: Verify actual upstream completeness
        if: always()
        run: |
          python3 scripts/verify_upstream_coverage.py \
            --catalog rules/sources.json \
            --report "$RUNNER_TEMP/upstream-review/UPSTREAM_REVIEW.json"
