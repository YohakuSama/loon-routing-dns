name: Full Upstream Live Audit
on:
  pull_request:
    paths:
      - 'scripts/upstream_review.py'
      - 'scripts/verify_upstream_coverage.py'
      - 'tests/test_upstream_live.py'
      - '.github/workflows/upstream-live-audit.yml'
      - 'rules/sources.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all 87 sources and generate quarantined review
        run: python3 scripts/upstream_review.py --output "$RUNNER_TEMP/upstream-review"
      - name: Upload source snapshots and risk findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-upstream-live-review
          path: ${{ runner.temp }}/upstream-review/
          retention-days: 7
          if-no-files-found: warn
      - name: Verify actual upstream completeness
        if: always()
        run: |
          python3 scripts/verify_upstream_coverage.py \
            --catalog rules/sources.json \
            --report "$RUNNER_TEMP/upstream-review/UPSTREAM_REVIEW.json"
