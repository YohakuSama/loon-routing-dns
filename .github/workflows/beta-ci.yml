name: LoonKit Beta CI
on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate unmodified formal publication baseline
        run: |
          python3 scripts/source_lock.py --check
          python3 scripts/verify_release.py --check --remote
          python3 scripts/license_audit.py --check
      - name: Reproduce frozen beta asset bytes
        run: python3 scripts/beta_assets.py --check
      - name: Beta routing/priority and channel regressions
        run: python3 -m unittest discover -s tests -p 'test_beta*.py' -v
      - name: Existing maintenance and client-script regression suite
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/diagnostics.test.cjs
          node --check scripts/v20261022r11/node-intelligence.js
          node --check scripts/v20261022r11/network-diagnostics.js
          node --check scripts/v20261022r11/media-unlock.js
      - name: Preserve production git tree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
