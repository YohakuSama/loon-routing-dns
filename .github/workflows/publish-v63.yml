name: Publish LoonKit v6.3.0
on:
  workflow_run:
    workflows: ["LoonKit Production CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-loonkit-v63
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exactly the main commit approved by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and publish immutable v6.3.0 config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
          if ! grep -qx '# LoonKit v6.3.0' <(head -n 1 LoonKit.lcf); then
            echo "Current configuration belongs to another version, skipping historic publisher."
            exit 0
          fi
          current_main="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
          if [ "$current_main" != "$CHECKED_SHA" ]; then
            echo "Newer main commit exists; do not publish older state."
            exit 0
          fi
          python3 scripts/source_lock.py --check
          python3 scripts/verify_release.py --check
          python3 -m unittest discover -s tests -p 'test_v63_service_release.py'
          EXPECTED="47c145baeb68ae828db13095a88258961418fe235460bd28f28d1faf0c1deb45"
          test "$(sha256sum LoonKit.lcf | cut -d ' ' -f 1)" = "$EXPECTED"
          if gh release view v6.3.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/v6.3.0" --jq '.object.sha')"
            git fetch origin "refs/tags/v6.3.0:refs/tags/v6.3.0" --quiet
            git merge-base --is-ancestor "$tag_sha" "$CHECKED_SHA" || {
              echo "Published v6.3.0 tag is not part of current main ancestry."
              exit 1
            }
            mkdir -p existing-release
            gh release download v6.3.0 --repo "$GH_REPO" --pattern LoonKit.lcf --dir existing-release
            test "$(sha256sum existing-release/LoonKit.lcf | cut -d ' ' -f 1)" = "$EXPECTED" || {
              echo "Existing v6.3.0 release attachment differs from original."
              exit 1
            }
            cmp -s LoonKit.lcf existing-release/LoonKit.lcf || {
              echo "Current profile changed without a new version."
              exit 1
            }
            echo "v6.3.0 release verified unchanged."
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v6.3.0" >/dev/null 2>&1; then
            echo "Tag exists without release; manual verification required."
            exit 1
          fi
          mkdir -p release-output
          cp LoonKit.lcf release-output/LoonKit.lcf
          (cd release-output && sha256sum LoonKit.lcf > SHA256SUMS)
          gh release create v6.3.0 \
            release-output/LoonKit.lcf release-output/SHA256SUMS \
            --repo "$GH_REPO" --target "$CHECKED_SHA" \
            --title "LoonKit v6.3.0" \
            --notes-file docs/RELEASE_NOTES_v6.3.0.md
          gh release view v6.3.0 --repo "$GH_REPO" --json url,tagName --jq '.url'
