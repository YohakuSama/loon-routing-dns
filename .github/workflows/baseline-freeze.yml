name: Phase 01 immutable routing baselines

on:
  push:
    branches: [refactor/loonkit-vnext]
    paths:
      - 'baselines/**'
      - 'scripts/compare_baselines.py'
      - 'tests/test_baseline_freeze.py'
      - '.github/workflows/baseline-freeze.yml'
  pull_request:
    paths:
      - 'baselines/**'
      - 'scripts/compare_baselines.py'
      - 'tests/test_baseline_freeze.py'
      - '.github/workflows/baseline-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned historical and current source bytes
        run: python3 -m unittest discover -s tests -p 'test_baseline_freeze.py' -v
      - name: Compare immutable baselines (read-only)
        run: |
          python3 scripts/compare_baselines.py --markdown-out /tmp/loonkit-baseline-comparison.md --json-out /tmp/loonkit-baseline-comparison.json
          python3 -m json.tool /tmp/loonkit-baseline-comparison.json >/dev/null
      - name: Run existing offline Python tests
        run: |
          python3 -m unittest discover -s tests -p 'test_composite_rules.py' -v
          python3 tests/test_hybrid_profile.py --generated
          python3 -m unittest discover -s tests -p 'test_import_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_repository_hygiene.py' -v
          python3 -m unittest discover -s tests -p 'test_dns_privacy_profile.py' -v
      - name: Existing static repository validator
        run: python3 scripts/validate_repo.py
