name: Phase 07 pinned RC2 production readiness (read only)
on:
  push:
    branches: [main, refactor/loonkit-vnext]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated frozen sources
        run: |
          python3 scripts/vnext_source_lock.py --check
          python3 scripts/phase07_historical_attestation.py --check
          python3 scripts/vnext_rule_engine.py --check
          python3 scripts/vnext_phase05_report.py --check
      - name: Build both production-compatible candidate profiles (offline)
        run: |
          python3 scripts/phase07_release.py --build
          python3 scripts/phase07_release.py --check
      - name: RC2 and historical regression plus gate schema
        run: |
          python3 scripts/phase07_gate.py --lint
          python3 scripts/phase07_resource_audit.py --check
          python3 scripts/phase07_license_audit.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/validate_repo.py
          python3 scripts/build-appstore-icons.py --check-config
          git diff --exit-code -- LoonKit.lcf LoonKit.PrivacyDNS.lcf release/phase-07/RC_MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase07-rc2-dual-profile-unreleased
          path: |
            LoonKit.lcf
            LoonKit.PrivacyDNS.lcf
            release/phase-07/LoonKit.vNext-RC2.lcf
            release/phase-07/LoonKit.PrivacyDNS.vNext-RC2.lcf
            release/phase-07/RC_MANIFEST.json
            release/phase-07/RELEASE_GATE.json
            release/phase-07/release_spec.json
            release/phase-07/DEVICE_TEST_PLAN.md
            release/phase-07/MIGRATION_ROLLBACK.md
            release/phase-07/LICENSE_REVIEW.md
            release/phase-07/LICENSE_SOURCE_LEDGER.json
            validation/phase-05/RESULT_TEMPLATE.json
          retention-days: 30
          if-no-files-found: error

  merge-and-rollback-simulation:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge into disposable main worktree, verify, and undo without changing main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/loonkit-main-rehearsal origin/main
          (
            cd /tmp/loonkit-main-rehearsal
            base="$(git rev-parse HEAD)"
            git -c user.name=ReleaseCI -c user.email=release-ci@example.invalid merge --no-ff --no-commit "$GITHUB_SHA"
            python3 scripts/vnext_source_lock.py --check
            python3 scripts/phase07_historical_attestation.py --check
            python3 scripts/vnext_rule_engine.py --check
            python3 scripts/phase07_release.py --check
            python3 scripts/phase07_gate.py --lint
            python3 scripts/phase07_resource_audit.py --check
            python3 scripts/phase07_license_audit.py --check
            python3 -m unittest discover -s tests -p 'test_phase07_release.py' -v
            for config in LoonKit.lcf LoonKit.PrivacyDNS.lcf; do
              expected="$(git show "$GITHUB_SHA:$config" | sha256sum | cut -f1 -d' ')"
              actual="$(sha256sum "$config" | cut -f1 -d' ')"
              test "$expected" = "$actual"
            done
            git merge --abort
            test "$(git rev-parse HEAD)" = "$base"
            git diff --quiet
            test -z "$(git status --porcelain)"
          )
          git worktree remove /tmp/loonkit-main-rehearsal
  maintainer-release-gate:
    if: github.event_name == 'pull_request'
    needs: [build-and-validate, merge-and-rollback-simulation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Hard-block unauthorized production PR
        run: python3 scripts/phase07_gate.py --require-ready
