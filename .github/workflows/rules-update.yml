name: Upstream Review (read only)
on:
  schedule:
    - cron: '20 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_release.py --check
      - name: Validate immutable pinned resources on GitHub Raw
        run: python3 scripts/verify_release.py --check --remote
      - name: Fetch, normalize, deduplicate and analyze upstream changes (review only)
        run: python3 scripts/upstream_review.py --output "$RUNNER_TEMP/upstream-review"
      - name: Verify candidate preview remains exactly pinned and summarize risks
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base=Path.cwd()
          directory=Path(os.environ["RUNNER_TEMP"])/"upstream-review"
          report=json.loads((directory/"UPSTREAM_REVIEW.json").read_text())
          assert report["publication_allowed"] is False
          assert report["preview_sha256_unchanged"] is True
          assert len(report["groups"]) == 26
          for group in report["groups"]:
              name="AnimeCrazy" if group=="動畫瘋" else group
              def rules(path):
                  return {line.strip() for line in path.read_text().splitlines()
                          if line.strip() and not line.lstrip().startswith(("#",";","//"))}
              old=rules(base/"rules/releases/vNext-RC2"/(name+".list"))
              preview=rules(directory/"candidate"/(name+".list"))
              assert old==preview, "unapproved changed preview: "+group
          additions=sum(g["added"] for g in report["groups"].values())
          deletions=sum(g["removed"] for g in report["groups"].values())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as fd:
              fd.write("## Upstream rule review (not publishable)\n")
              fd.write(f"Sources requiring review: {report['incomplete_sources']}\n")
              fd.write(f"Proposed additions: {additions}; proposed deletions: {deletions}\n")
              fd.write("All 26 candidate previews match the immutable published baseline.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-safe-candidates-only
          path: |
            ${{ runner.temp }}/upstream-review/
          retention-days: 7
          if-no-files-found: error
      - name: Require complete upstream source coverage after uploading evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RUNNER_TEMP"]) / "upstream-review/UPSTREAM_REVIEW.json"
          if not report_path.is_file():
              raise SystemExit("INCOMPLETE: upstream report missing; no claim of full coverage.")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          bad = [source for source in report["sources"]
                 if source.get("status") != "PARSED_FOR_REVIEW"]
          required = 87
          complete = (report["source_count"] == required
                      and report["snapshot_count"] == required
                      and not bad and report["incomplete_sources"] == 0)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fd:
              fd.write("\\n## Coverage verdict\\n")
              fd.write(f"Sources cataloged: {report['source_count']}/{required}\\n")
              fd.write(f"Raw snapshots: {report['snapshot_count']}/{required}\\n")
              fd.write(f"Sources incomplete or unsupported: {len(bad)}\\n")
              fd.write("Published rules were not modified.\\n")
              if bad:
                  fd.write("\\n### Incomplete source IDs\\n")
                  for row in bad:
                      fd.write(f"- {row['id']}: {row['status']} "
                               f"(invalid lines: {row.get('invalid_count', 'unknown')})\\n")
          if not complete:
              raise SystemExit("INCOMPLETE UPSTREAM COVERAGE: inspect uploaded review artifact and source IDs.")
          print("All 87 sources read and parsed for review; publication remains blocked.")
          PY
