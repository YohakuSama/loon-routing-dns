name: Upstream Review (read only)
on:
  schedule:
    - cron: '20 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_release.py --check
      - name: Validate immutable pinned resources on GitHub Raw
        run: python3 scripts/verify_release.py --check --remote
      - name: Fetch, normalize, deduplicate and analyze upstream changes (review only)
        run: python3 scripts/upstream_review.py --output "$RUNNER_TEMP/upstream-review"
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-safe-candidates-only
          path: |
            ${{ runner.temp }}/upstream-review/
          retention-days: 7
          if-no-files-found: error
