name: Phase 04 vNext candidate engine and full regression
on:
  push:
    branches: [refactor/loonkit-vnext]
    paths:
      - 'scripts/vnext_rule_engine.py'
      - 'refactor/vnext/engine_manifest.json'
      - 'refactor/vnext/generated/**'
      - 'refactor/vnext/reports/**'
      - 'refactor/vnext/LoonKit.vNext.Candidate.lcf'
      - 'tests/test_phase04_vnext.py'
      - '.github/workflows/phase-04-vnext.yml'
  workflow_dispatch:

concurrency:
  group: phase04-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-committed-candidate:
    if: github.ref == 'refs/heads/refactor/loonkit-vnext'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the committed candidate without rewriting it
        run: python3 scripts/vnext_rule_engine.py --check
      - name: Phase 04 vNext engine tests
        run: python3 -m unittest discover -s tests -p test_phase04_vnext.py -v
      - name: Existing phase 01, 02, 03 and full offline Python regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/audit_rule_conflicts.py --output audits/phase-02 --check
          python3 scripts/compare_baselines.py --markdown-out /tmp/vnext-baseline.md --json-out /tmp/vnext-baseline.json
          python3 tests/test_hybrid_profile.py --generated
          python3 scripts/validate_repo.py
          python3 scripts/build-appstore-icons.py --check-config
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node regressions
        run: |
          node --check scripts/v20261018r11/network-diagnostics.js
          node --check scripts/v20261018r11/node-intelligence.js
          node tests/test_node_copy.js
          node tests/test_network_diagnostics.js
          node tests/test_current_plugin.js
      - name: Assert existing runtime and frozen baselines unchanged
        run: |
          git diff --exit-code HEAD -- LoonKit.lcf LoonKit.PrivacyDNS.lcf rules/ baselines/ scripts/build_composite_rules.py
          test "$(git branch --show-current)" = "refactor/loonkit-vnext"
      - name: Verify committed candidate tree is unchanged
        run: |
          python3 scripts/vnext_rule_engine.py --check
          git diff --exit-code
