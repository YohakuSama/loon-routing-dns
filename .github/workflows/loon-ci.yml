name: Loon Configuration & Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-regression:
    name: Config, plugin and JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Loon config and plugin references
        run: python3 scripts/validate_repo.py

      - name: Check current icons and public plugin links
        run: python3 scripts/build-appstore-icons.py --check-config

      - name: Run rule generator and release-profile regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_composite_rules.py' -v
          python3 tests/test_hybrid_profile.py --generated
          python3 -m unittest discover -s tests -p 'test_repository_hygiene.py' -v

      - name: Check JavaScript syntax
        run: |
          node --check scripts/network-diagnostics.js
          node --check scripts/node-intelligence.js
          node --check tests/test_scripts.js
          node --check tests/test_console.js
          node --check scripts/console.js
          node --check scripts/v20261018r4/network-diagnostics.js
          node --check scripts/v20261018r4/node-intelligence.js
          node --check tests/test_plugin_v2.js
          node --check scripts/v20261018r5/node-intelligence.js
          node --check tests/test_node_details.js
          node --check tests/test_removed_dns_leak.js
          node --check scripts/v20261018r10/node-intelligence.js
          node --check tests/test_node_copy.js

      - name: Run Loon mocked-runtime regression tests
        run: |
          node tests/test_scripts.js
          node tests/test_console.js
          node tests/test_plugin_v2.js
          node tests/test_node_details.js
          node tests/test_removed_dns_leak.js
          node tests/test_node_copy.js

  upstream-resource-check:
    name: Check upstream rules, scripts, and icons
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify all external resource URLs
        run: python3 scripts/validate_repo.py --check-remote
