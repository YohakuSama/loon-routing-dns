name: Render Original Neutral Icon Assets
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/build_neutral_icons.py'
      - '.github/workflows/neutral-icon-generation.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/neutral-icons-assets-v6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build independent PNG icons
        run: |
          python3 scripts/build_neutral_icons.py --out icons/v20261021r2
          test "$(find icons/v20261021r2 -name '*.png' -type f | wc -l)" -eq 34
      - name: Commit generated assets to review branch only
        run: |
          git add icons/v20261021r2/
          if git diff --cached --quiet; then
            echo "No icon changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets: generate 34 original neutral strategy icons'
          git push origin HEAD:refs/heads/fix/neutral-icons-assets-v6
