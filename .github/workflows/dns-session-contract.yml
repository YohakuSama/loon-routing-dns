name: Temporary bash.ws session contract probe

on:
  pull_request:
    paths:
      - '.github/workflows/dns-session-contract.yml'

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect bash.ws session responses without recording IDs
        shell: bash
        run: |
          set +e
          for variant in default json; do
            case "$variant" in
              default) accept='*/*' ;;
              json) accept='application/json, text/plain' ;;
            esac
            curl -sSL --max-time 12 --header "Accept: $accept" --output "/tmp/response_$variant" --dump-header "/tmp/headers_$variant" --write-out '%{http_code}' https://bash.ws/id > "/tmp/status_$variant"
          done
          python3 - <<'PY'
          import json, pathlib, re
          for variant in ("default", "json"):
              body=pathlib.Path("/tmp/response_"+variant)
              headers=pathlib.Path("/tmp/headers_"+variant)
              status=pathlib.Path("/tmp/status_"+variant)
              raw=body.read_bytes() if body.exists() else b""
              text=raw.decode("utf-8","replace").strip()
              kind="numeric" if re.fullmatch(r"[0-9]+",text) else "empty" if not text else "other"
              if text.startswith("{") or text.startswith("["):
                  try:
                      obj=json.loads(text)
                      kind="json-"+type(obj).__name__
                      if isinstance(obj,dict): print("keys",variant,sorted(obj.keys())[:15])
                  except Exception:kind="invalid-json"
              elif text.startswith("<"): kind="html-or-xml"
              hdr=headers.read_text(errors="replace") if headers.exists() else ""
              mime=re.findall(r"(?im)^content-type:\s*([^\r\n]+)",hdr)
              http=status.read_text().strip() if status.exists() else "no-status"
              is_label=bool(re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?",text))
              print(variant,"http="+http,"mime="+(mime[-1] if mime else "unknown"),
                    "body_bytes="+str(len(raw)),"body_kind="+kind,"trimmed_length="+str(len(text)),
                    "numeric_pattern="+str(bool(re.fullmatch(r"[0-9]{1,18}",text))),
                    "hex_pattern="+str(bool(re.fullmatch(r"[0-9a-fA-F]{16}",text))),
                    "alphanumeric_pattern="+str(bool(re.fullmatch(r"[A-Za-z0-9]{16}",text))),
                    "valid_DNS_label="+str(is_label),
                    "contains_hyphen="+str("-" in text))
          PY
          python3 - <<'PY'
          import json, pathlib, re, subprocess, time, urllib.request
          id=pathlib.Path("/tmp/response_default").read_text().strip()
          if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?",id):
              print("contract: unsafe session label; cannot send DNS test")
              raise SystemExit(1)
          # Exercise exactly one fresh test domain; never log the session ID or IPs.
          try:
              result=subprocess.run(["getent","ahostsv4","1."+id+".bash.ws"],
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=12)
              print("dns_lookup_returncode",result.returncode)
          except Exception as e:print("dns_lookup_error",type(e).__name__)
          time.sleep(4)
          try:
              req=urllib.request.Request("https://bash.ws/dnsleak/test/"+id+"?json",
                   headers={"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=12) as response:
                  body=response.read(100000).decode("utf-8","replace")
                  print("result_http",response.status,"result_content_type",response.headers.get("Content-Type"))
              obj=json.loads(body)
              if isinstance(obj,list):
                  from collections import Counter
                  print("result_list_length",len(obj))
                  print("result_types",dict(Counter(str(x.get("type","")) for x in obj if isinstance(x,dict))))
                  print("result_keys",sorted(set().union(*(x.keys() for x in obj if isinstance(x,dict))))[:20] if obj else [])
              else:print("result_json_shape",type(obj).__name__)
          except Exception as e: print("result_error",type(e).__name__)
          PY
          PY
