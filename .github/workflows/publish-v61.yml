name: Publish LoonKit v6.1.0
on:
  workflow_run:
    workflows: ["LoonKit Production CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-loonkit-v61
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exactly the CI-approved main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish reviewed v6.1.0 profile
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
          if ! grep -qx '# LoonKit v6.1.0' <(head -n 1 LoonKit.lcf); then
            echo "Not the v6.1.0 release profile; no publication."
            exit 0
          fi
          current_main="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
          if [ "$current_main" != "$CHECKED_SHA" ]; then
            echo "A newer main commit exists; refusing stale release."
            exit 0
          fi
          python3 scripts/source_lock.py --check
          python3 scripts/verify_release.py --check
          python3 -c 'import json; from pathlib import Path; s=json.loads(Path("build/release_spec.json").read_text()); assert s["stable_release_version"]=="v6.1.0"; assert s["optional_service_plugin_commit"]=="7cb02a4be5db739d74266536fefbc54b720ec35b"'
          if gh release view v6.1.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            published_tag="$(gh api "repos/$GH_REPO/git/ref/tags/v6.1.0" --jq '.object.sha')"
            test "$published_tag" = "$CHECKED_SHA" || {
              echo "Existing tag differs from reviewed commit. Refusing to overwrite."
              exit 1
            }
            mkdir -p existing-release
            gh release download v6.1.0 --repo "$GH_REPO" --pattern LoonKit.lcf --dir existing-release
            cmp -s LoonKit.lcf existing-release/LoonKit.lcf || {
              echo "Release attachment differs from tested profile."
              exit 1
            }
            current_notes="$(gh release view v6.1.0 --repo "$GH_REPO" --json body --jq '.body')"
            desired_notes="$(cat docs/RELEASE_NOTES_v6.1.0.md)"
            if [ "$current_notes" != "$desired_notes" ]; then
              gh release edit v6.1.0 --repo "$GH_REPO" --notes-file docs/RELEASE_NOTES_v6.1.0.md
            fi
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v6.1.0" >/dev/null 2>&1; then
            echo "v6.1.0 tag exists without a verified Release."
            exit 1
          fi
          mkdir -p release-output
          cp LoonKit.lcf release-output/LoonKit.lcf
          (cd release-output && sha256sum LoonKit.lcf > SHA256SUMS)
          gh release create v6.1.0 \
            release-output/LoonKit.lcf release-output/SHA256SUMS \
            --repo "$GH_REPO" --target "$CHECKED_SHA" \
            --title "LoonKit v6.1.0" \
            --notes-file docs/RELEASE_NOTES_v6.1.0.md
          gh release view v6.1.0 --repo "$GH_REPO" --json url,tagName --jq '.url'
