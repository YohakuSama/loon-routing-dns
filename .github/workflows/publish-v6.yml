name: Publish LoonKit v6.0.0
on:
  workflow_run:
    workflows: ["LoonKit Production CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-loonkit-v6
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exactly the commit that passed Production CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Match the production CI Python interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert release builder runtime
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3,12)'
      - name: Publish immutable validated tag and configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # No unreviewed PR branches, races with newer commits, or mutable tags.
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
          current_main="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
          test "$current_main" = "$CHECKED_SHA" || {
            echo "A newer commit exists; do not tag an older state."
            exit 0
          }
          if gh release view v6.0.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            # Notes are editable; the published tag, artifacts and image bytes are not.
            published_tag="$(gh api "repos/$GH_REPO/git/ref/tags/v6.0.0" --jq '.object.sha')"
            test "$published_tag" = "ef7fcc70c266638dd3278a1be0785609416bbcb0" || {
              echo "Unexpected v6.0.0 tag target, refusing to edit Release."
              exit 1
            }
            mkdir -p existing-release
            gh release download v6.0.0 --repo "$GH_REPO" \
              --pattern LoonKit.lcf --dir existing-release
            cmp -s LoonKit.lcf existing-release/LoonKit.lcf || {
              echo "Published configuration differs from tested copy; refusing to edit Release."
              exit 1
            }
            current_notes="$(gh release view v6.0.0 --repo "$GH_REPO" --json body --jq '.body')"
            desired_notes="$(cat docs/RELEASE_NOTES_v6.0.0.md)"
            if [ "$current_notes" != "$desired_notes" ]; then
              gh release edit v6.0.0 --repo "$GH_REPO" \
                --notes-file docs/RELEASE_NOTES_v6.0.0.md
              echo "Updated Release description only."
            else
              echo "Release description already matches the reviewed notes."
            fi
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v6.0.0" >/dev/null 2>&1; then
            echo "Tag already exists without a release: require manual verification."
            exit 1
          fi

          python3 scripts/source_lock.py --check
          python3 scripts/verify_release.py --check
          mkdir -p release-output
          cp LoonKit.lcf release-output/LoonKit.lcf
          (cd release-output && sha256sum LoonKit.lcf > SHA256SUMS)
          gh release create v6.0.0 \
            release-output/LoonKit.lcf release-output/SHA256SUMS \
            --repo "$GH_REPO" \
            --target "$CHECKED_SHA" \
            --title "LoonKit v6.0.0" \
            --notes-file docs/RELEASE_NOTES_v6.0.0.md
          echo "Release created at tested commit $CHECKED_SHA."
          gh release view v6.0.0 --repo "$GH_REPO" --json url,tagName --jq '.url'
