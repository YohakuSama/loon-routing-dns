name: Build Console Plugin Icon (review only)
on:
  push:
    branches: [main]
    paths:
      - icons/source/Console.svg
      - scripts/generate-console-icon.mjs
      - .github/workflows/console-icon.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-console-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund sharp@0.34.4
      - run: node scripts/generate-console-icon.mjs
      - name: Upload unversioned preview for human review
        uses: actions/upload-artifact@v4
        with:
          name: console-icon-review
          path: icons/Console.png
          if-no-files-found: error
          retention-days: 14
      # Publishing a new versioned icon release requires a reviewed PR.
