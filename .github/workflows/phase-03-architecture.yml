name: Phase 03 routing architecture (read-only)
on:
  push:
    branches:
      - refactor/loonkit-vnext
    paths:
      - 'design/phase-03/**'
      - 'refactor/vnext/**'
      - 'tests/test_phase03_architecture.py'
      - '.github/workflows/phase-03-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-and-full-offline-ci:
    if: github.ref == 'refs/heads/refactor/loonkit-vnext'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Phase 01 baseline and source byte integrity
        run: |
          python3 -m unittest discover -s tests -p 'test_baseline_freeze.py' -v
          python3 scripts/compare_baselines.py --markdown-out /tmp/phase03-baseline.md --json-out /tmp/phase03-baseline.json
      - name: Phase 02 immutable audit verification
        run: |
          python3 -m unittest discover -s tests -p 'test_phase02_audit.py' -v
          python3 scripts/audit_rule_conflicts.py --output audits/phase-02 --check
      - name: Phase 03 independent architecture acceptance
        run: python3 -m unittest discover -s tests -p 'test_phase03_architecture.py' -v
      - name: Complete existing offline Python regression suite
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/test_hybrid_profile.py --generated
          python3 scripts/validate_repo.py
          python3 scripts/build-appstore-icons.py --check-config
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing JavaScript syntax and mocked-runtime tests
        run: |
          node --check scripts/v20261018r11/network-diagnostics.js
          node --check scripts/v20261018r11/node-intelligence.js
          node --check tests/test_node_copy.js
          node --check tests/test_network_diagnostics.js
          node --check tests/test_current_plugin.js
          node tests/test_node_copy.js
          node tests/test_network_diagnostics.js
          node tests/test_current_plugin.js
      - name: Ensure no workflow modified protected inputs
        run: |
          git diff --exit-code HEAD -- LoonKit.lcf LoonKit.PrivacyDNS.lcf rules/ baselines/ scripts/build_composite_rules.py
          git status --porcelain
