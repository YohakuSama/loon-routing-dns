name: Manual Release Candidate (read only)
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: 'New version (e.g. v6.0.1-rc1)'
        type: string
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_release.py --check
      - run: python3 scripts/license_audit.py --check
      - name: Build immutable-input release preview
        env:
          # Never interpolate workflow_dispatch input inside a shell script.
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/prepare_release.py --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/candidate" --build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-release-candidate
          path: ${{ runner.temp }}/candidate/
          retention-days: 30
          if-no-files-found: error
