name: Audit App Store Icon Candidates
on:
  push:
    branches:
      - audit/appstore-icon-quality-20261018
    paths:
      - scripts/audit-appstore-icons.py
      - .github/workflows/appstore-icon-audit.yml
      - scripts/check-appstore-png-variants.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/appstore-icon-quality-20261018
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspection libraries
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Fetch metadata, inspect image pixel quality and produce candidate report
        run: python scripts/audit-appstore-icons.py
      - name: Compare official JPEG and PNG artwork endpoints
        run: python scripts/check-appstore-png-variants.py
      - name: Commit text-only candidate audit reports to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/APP_STORE_ICON_AUDIT_2026-10-18.json reviews/APP_STORE_ICON_AUDIT_2026-10-18.md reviews/APP_STORE_ICON_FORMAT_TEST_2026-10-18.md
          if ! git diff --cached --quiet; then
            git commit -m "audit: record App Store icon resolution and contrast results"
            git push origin HEAD:audit/appstore-icon-quality-20261018
          fi
